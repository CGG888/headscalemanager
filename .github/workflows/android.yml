name: Android CI

# 任何分支 push / PR 都跑；也可以在 Actions 页面手动触发（workflow_dispatch）。
on:
  push:
  pull_request:
  workflow_dispatch:

# 只读权限即可，工作流不需要写仓库
permissions:
  contents: read

# 同一分支的新提交会取消上一次未完成的运行，省 CI 时间
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  # 与本机验证过的版本一致，避免 SDK 漂移导致“本地能过、CI 挂”
  FLUTTER_VERSION: '3.47.6'

jobs:
  analyze-and-test:
    name: 静态分析 + 单元测试
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: flutter pub get
        run: flutter pub get

      # 默认即把 warning/error 视为失败；当前仓库为 0 问题
      - name: flutter analyze
        run: flutter analyze

      - name: flutter test
        run: flutter test --reporter expanded

  build-apk:
    name: 构建 Android APK
    runs-on: ubuntu-latest
    needs: analyze-and-test          # 分析/测试不过就不浪费构建时间
    env:
      # 可选：配置这 4 个 Secrets 即可产出「正式签名」的 release APK：
      #   ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD
      # 未配置时 Gradle 会自动回退到 debug 签名（仍可直接安装到手机，
      # 但不能上架 Play，也不能覆盖此前用正式密钥安装的版本）。
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # 签名密钥：优先用 Secrets 里的正式密钥；没有则自建一把并缓存，
      # 使多次构建使用同一把密钥（否则每次构建都是新密钥，用户无法覆盖升级）。
      - name: Cache CI signing keystore
        uses: actions/cache@v4
        with:
          path: ~/.ci-signing
          key: ci-signing-keystore-v1

      # 接受 SDK 许可并预装项目声明的 platform。许可被接受后，
      # AGP 也能在构建时自行下载缺失的 platform/build-tools/NDK。
      # 刻意容错（continue-on-error + || true）：即使 sdkmanager 不在 PATH 或
      # 某个版本号不存在，也不要在构建开始前就整段失败。
      - name: 接受 SDK 许可并预装组件（失败不阻塞）
        continue-on-error: true
        run: |
          SDKMANAGER="$(command -v sdkmanager || echo "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager")"
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platforms;android-36" || true
          echo "SDK 组件准备结束（缺失部分由 AGP 在构建时补齐）"

      - name: 准备签名密钥（优先 Secrets，否则自建并缓存）
        run: |
          mkdir -p "$HOME/.ci-signing"
          KS="$HOME/.ci-signing/signing.jks"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "$KS"
            SP="$KEYSTORE_PASSWORD"; ALIAS="$KEY_ALIAS"; KP="$KEY_PASSWORD"
            echo "::notice::使用 Secrets 中配置的正式签名密钥"
          else
            SP=android; ALIAS=ci; KP=android
            if [ ! -f "$KS" ]; then
              keytool -genkeypair -keystore "$KS" -storepass "$SP" -keypass "$KP" \
                -alias "$ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Headscale Manager CI, O=CGG888, C=CN"
              echo "::warning::未配置 Secrets，已新建签名密钥并缓存。缓存若被清理则密钥会变化，届时用户需卸载重装；建议在仓库 Secrets 中配置正式密钥。"
            else
              echo "::notice::复用缓存的签名密钥（跨构建保持稳定）"
            fi
          fi
          cp "$KS" android/key.jks
          printf 'storePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$SP" "$ALIAS" "$KP" > android/key.properties
          {
            echo "SIGN_KS=$KS"
            echo "SIGN_ALIAS=$ALIAS"
            echo "SIGN_STORE_PASS=$SP"
            echo "SIGN_KEY_PASS=$KP"
          } >> "$GITHUB_ENV"

      - name: flutter pub get
        run: flutter pub get

      # 仅用于失败时排查环境（Android SDK / 许可 / NDK 状态），不影响构建结果
      - name: 环境信息（诊断用）
        continue-on-error: true
        run: flutter doctor -v

      - name: flutter build apk --release
        run: flutter build apk --release

      # 统一重签为 v1+v2+v3 并校验（理由同 release.yml：AGP 在 minSdk>=24 时
      # 可能只产出 v2/v3，而缺 v1 会让部分安装器报「安装包没有签名文件」）。
      - name: 重签为 v1+v2+v3 并校验
        run: |
          set -o pipefail
          BT="$(ls -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools/* | sort -V | tail -1)"
          APK=build/app/outputs/flutter-apk/app-release.apk
          echo "使用 $BT/apksigner，密钥 $SIGN_KS"
          "$BT/zipalign" -f -p 4 "$APK" "$APK.aligned"
          "$BT/apksigner" sign \
            --ks "$SIGN_KS" --ks-pass "pass:$SIGN_STORE_PASS" \
            --key-pass "pass:$SIGN_KEY_PASS" --ks-key-alias "$SIGN_ALIAS" \
            --min-sdk-version 21 \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --out "$APK" "$APK.aligned"
          rm -f "$APK.aligned"

          # 硬判据：APK 里到底有没有 v1(JAR) 签名文件。
          echo "--- APK 内 META-INF 内容 ---"
          unzip -l "$APK" | grep -iE 'META-INF/' || echo "(无 META-INF 条目)"
          V1_FILES="$(unzip -l "$APK" | grep -icE 'META-INF/.*\.(RSA|DSA|EC)' || true)"
          echo "v1 签名文件数: $V1_FILES"

          # apksigner verify 默认按 APK 的 minSdkVersion 校验，minSdk>=24 时不检查 v1
          # （一律显示 false），因此强制按 API 21 校验。
          OUT="$("$BT/apksigner" verify --verbose --print-certs --min-sdk-version 21 "$APK" 2>&1 || true)"
          echo "$OUT"

          [ "$V1_FILES" -ge 1 ] \
            || { echo "::error::APK 中没有 v1(JAR) 签名文件"; exit 1; }
          echo "$OUT" | grep -q "Verified using v1 scheme (JAR signing): true" \
            || { echo "::error::v1 签名文件存在但按 API 21 校验未通过"; exit 1; }
          echo "$OUT" | grep -qE "Verified using v(2|3) scheme.*: true" \
            || { echo "::error::重签后仍缺 v2/v3 签名"; exit 1; }

      # 想额外产出按 CPU 架构拆分的小体积 APK（体积约减半，但需按机型分发），
      # 取消下面这行注释即可（会与上面的通用包一起上传）：
      # - name: flutter build apk --release --split-per-abi
      #   run: flutter build apk --release --split-per-abi

      - name: 显示产物
        run: ls -lh build/app/outputs/flutter-apk/

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: headscalemanager-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 30
