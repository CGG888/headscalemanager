name: Android CI

# 任何分支 push / PR 都跑；也可以在 Actions 页面手动触发（workflow_dispatch）。
on:
  push:
  pull_request:
  workflow_dispatch:

# 只读权限即可，工作流不需要写仓库
permissions:
  contents: read

# 同一分支的新提交会取消上一次未完成的运行，省 CI 时间
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  # 与本机验证过的版本一致，避免 SDK 漂移导致“本地能过、CI 挂”
  FLUTTER_VERSION: '3.47.6'

jobs:
  analyze-and-test:
    name: 静态分析 + 单元测试
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: flutter pub get
        run: flutter pub get

      # 默认即把 warning/error 视为失败；当前仓库为 0 问题
      - name: flutter analyze
        run: flutter analyze

      - name: flutter test
        run: flutter test --reporter expanded

  build-apk:
    name: 构建 Android APK
    runs-on: ubuntu-latest
    needs: analyze-and-test          # 分析/测试不过就不浪费构建时间
    env:
      # 可选：配置这 4 个 Secrets 即可产出「正式签名」的 release APK：
      #   ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD
      # 未配置时 Gradle 会自动回退到 debug 签名（仍可直接安装到手机，
      # 但不能上架 Play，也不能覆盖此前用正式密钥安装的版本）。
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # 接受 SDK 许可并预装项目声明的 platform/build-tools；
      # 许可被接受后，AGP 也能在需要时自行下载 NDK 等缺失组件。
      - name: 预装 Android SDK 组件
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: 注入正式签名密钥（仅在配置了 Secrets 时）
        if: ${{ env.KEYSTORE_B64 != '' }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > android/key.jks
          printf 'storePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties
          echo "::notice::已注入正式签名密钥（release APK 将使用正式签名）"

      - name: flutter pub get
        run: flutter pub get

      # 仅用于失败时排查环境（Android SDK / 许可 / NDK 状态），不影响构建结果
      - name: 环境信息（诊断用）
        continue-on-error: true
        run: flutter doctor -v

      - name: flutter build apk --release
        run: flutter build apk --release

      # 想额外产出按 CPU 架构拆分的小体积 APK（体积约减半，但需按机型分发），
      # 取消下面这行注释即可（会与上面的通用包一起上传）：
      # - name: flutter build apk --release --split-per-abi
      #   run: flutter build apk --release --split-per-abi

      - name: 显示产物
        run: ls -lh build/app/outputs/flutter-apk/

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: headscalemanager-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 30
