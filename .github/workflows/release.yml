name: Release

# 打 tag（v*）即自动构建 APK 并创建 GitHub Release，APK 直接挂在发行版附件里。
# 也可以手动触发（workflow_dispatch）并指定一个已存在的 tag。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布/重建的 tag（例如 v2.2.0）'
        required: true
        type: string

# 创建 Release 需要写权限
permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.6'

jobs:
  release:
    name: 构建 APK 并发布 Release
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 解析版本号
        id: ver
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            V="${{ github.ref_name }}"
          else
            V="${{ inputs.tag }}"
          fi
          echo "tag=$V" >> "$GITHUB_OUTPUT"
          echo "发布版本: $V"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # 签名密钥：优先用 Secrets 里的正式密钥；没有则自建一把并缓存，
      # 使多次构建使用同一把密钥（否则每次构建都是新密钥，用户无法覆盖升级）。
      - name: Cache CI signing keystore
        uses: actions/cache@v4
        with:
          path: ~/.ci-signing
          key: ci-signing-keystore-v1

      - name: 接受 SDK 许可并预装组件（失败不阻塞）
        continue-on-error: true
        run: |
          SDKMANAGER="$(command -v sdkmanager || echo "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platforms;android-36" || true

      - name: 准备签名密钥（优先 Secrets，否则自建并缓存）
        run: |
          mkdir -p "$HOME/.ci-signing"
          KS="$HOME/.ci-signing/signing.jks"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "$KS"
            SP="$KEYSTORE_PASSWORD"; ALIAS="$KEY_ALIAS"; KP="$KEY_PASSWORD"
            echo "::notice::使用 Secrets 中配置的正式签名密钥"
          else
            SP=android; ALIAS=ci; KP=android
            if [ ! -f "$KS" ]; then
              keytool -genkeypair -keystore "$KS" -storepass "$SP" -keypass "$KP" \
                -alias "$ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Headscale Manager CI, O=CGG888, C=CN"
              echo "::warning::未配置 Secrets，已新建签名密钥并缓存。缓存若被清理则密钥会变化，届时用户需卸载重装；建议在仓库 Secrets 中配置正式密钥。"
            else
              echo "::notice::复用缓存的签名密钥（跨构建保持稳定）"
            fi
          fi
          cp "$KS" android/key.jks
          printf 'storePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$SP" "$ALIAS" "$KP" > android/key.properties
          {
            echo "SIGN_KS=$KS"
            echo "SIGN_ALIAS=$ALIAS"
            echo "SIGN_STORE_PASS=$SP"
            echo "SIGN_KEY_PASS=$KP"
          } >> "$GITHUB_ENV"

      - name: flutter pub get
        run: flutter pub get

      - name: 校验（analyze + test）
        run: |
          flutter analyze
          flutter test

      - name: flutter build apk --release
        run: flutter build apk --release

      # 统一重签为 v1+v2+v3 并校验。
      # 不依赖 AGP 的签名方案行为：AGP 在 minSdk>=24 时会自行决定只做 v2/v3
      # （实测即使设置 enableV1Signing=true 仍不产出 v1），因此这里用 apksigner
      # 显式重签，v1/v2/v3 由工具保证。缺 v1 会让部分安装器报
      # 「解析失败，安装包没有签名文件」。
      - name: 重签为 v1+v2+v3 并校验
        run: |
          set -o pipefail
          BT="$(ls -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools/* | sort -V | tail -1)"
          APK=build/app/outputs/flutter-apk/app-release.apk
          echo "使用 $BT/apksigner，密钥 $SIGN_KS"
          "$BT/zipalign" -f -p 4 "$APK" "$APK.aligned"
          "$BT/apksigner" sign \
            --ks "$SIGN_KS" --ks-pass "pass:$SIGN_STORE_PASS" \
            --key-pass "pass:$SIGN_KEY_PASS" --ks-key-alias "$SIGN_ALIAS" \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --out "$APK" "$APK.aligned"
          rm -f "$APK.aligned"
          OUT="$("$BT/apksigner" verify --verbose --print-certs "$APK" 2>&1 || true)"
          echo "$OUT"
          echo "$OUT" | grep -q "Verified using v1 scheme (JAR signing): true" \
            || { echo "::error::重签后仍缺 v1(JAR) 签名"; exit 1; }
          echo "$OUT" | grep -qE "Verified using v(2|3) scheme.*: true" \
            || { echo "::error::重签后仍缺 v2/v3 签名"; exit 1; }

      - name: 整理产物文件名
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
             "dist/headscalemanager-${{ steps.ver.outputs.tag }}.apk"
          ls -lh dist/

      - name: 创建 Release 并附带 APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Headscale Manager ${{ steps.ver.outputs.tag }}
          body_path: RELEASE_NOTES.md
          files: dist/*.apk
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
