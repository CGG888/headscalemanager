# Set the JVM arguments for the Gradle daemon.
# 1.5G was too low and caused "Java heap space" during JetifyTransform.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# AndroidX only — Jetifier is obsolete for modern Flutter/AndroidX apps
# and was causing OOM on Flutter engine JARs.
android.useAndroidX=true
android.enableJetifier=false

# Set the Kotlin compiler to use JVM target 11.
kotlin.jvm.target=11
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
